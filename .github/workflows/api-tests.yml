name: API tests

# Separate from the deploy workflow on purpose: these run on every branch and
# every pull request, while the deploy only ever runs from main. Tests that only
# run at deploy time are tests that tell you too late.
on:
  push:
    paths:
      - 'api/**'
      - '.github/workflows/api-tests.yml'
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/api-tests.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    # A real Postgres, not SQLite. Encrypted columns, a partial unique index and
    # a sequence are not things a substitute can stand in for, and a suite that
    # passes against one proves nothing about the schema that ships.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dosebuddy_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dosebuddy_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Test
        run: python -m pytest

      # The suite builds its schema from the models, so it cannot catch a broken
      # migration — and the migration is what production runs. This step caught a
      # real one: the enum type was created twice and the whole upgrade failed.
      - name: The migration applies to an empty database
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/migration_check
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci
          ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres \
            -c 'CREATE DATABASE migration_check'
          alembic upgrade head
          alembic downgrade base

      # The suite builds its schema from the models; production runs the
      # migrations. Both passing separately says nothing about them agreeing,
      # and they did not: three columns carried a redundant index in production
      # that no test could see, because no test ever looked at the migrated
      # schema. A drift that is only cosmetic today is how a real one hides
      # tomorrow.
      - name: The models and the migrations describe the same schema
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/from_migrations
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci
          ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/from_models
        run: |
          for db in from_migrations from_models; do
            PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE $db"
          done
          alembic upgrade head
          python - <<'EOF'
          import asyncio, os
          from sqlalchemy.ext.asyncio import create_async_engine
          from app.db.session import Base
          # Importing Base alone leaves its metadata empty: the tables register
          # on it when the model classes are imported, and without this the
          # comparison would build nothing and compare nothing.
          import app.db.models  # noqa: F401

          async def build():
              engine = create_async_engine(os.environ["TEST_DATABASE_URL"])
              async with engine.begin() as conn:
                  await conn.exec_driver_sql(
                      "CREATE SEQUENCE IF NOT EXISTS server_seq")
                  await conn.run_sync(Base.metadata.create_all)
              await engine.dispose()

          asyncio.run(build())
          EOF
          # alembic_version exists only in the migrated one, by definition.
          q="SELECT tablename||' '||indexdef FROM pg_indexes
             WHERE schemaname='public' AND tablename<>'alembic_version' ORDER BY 1"
          for db in from_migrations from_models; do
            PGPASSWORD=postgres psql -h localhost -U postgres -d $db -Atc "$q" \
              | sed "s/$db//" > /tmp/$db.txt
          done
          if ! diff -u /tmp/from_models.txt /tmp/from_migrations.txt; then
            echo
            echo "The migrated schema differs from the one the models describe."
            echo "Left: models (what the tests run against)."
            echo "Right: migrations (what production runs)."
            exit 1
          fi
          echo "models and migrations agree on all $(wc -l < /tmp/from_models.txt) indexes"

      # The image installs from the lock file, so a dependency added to
      # requirements.txt without regenerating it is simply absent in
      # production — and no test notices, because tests install
      # requirements-dev.txt directly. That shipped twice before this check.
      - name: The lock file covers requirements.txt
        run: |
          pip install -r requirements.txt --dry-run --quiet --report /tmp/r.json
          python - <<'EOF'
          import json, re
          needed = {
              p["metadata"]["name"].lower().replace("_", "-")
              for p in json.load(open("/tmp/r.json"))["install"]
          }
          locked = {
              re.split(r"[=<>\[]", line, 1)[0].strip().lower().replace("_", "-")
              for line in open("requirements.lock.txt")
              if line.strip() and not line.startswith("#")
          }
          missing = needed - locked
          if missing:
              raise SystemExit(
                  f"requirements.lock.txt is stale, missing: {sorted(missing)}\n"
                  "Regenerate it — see deploy/README.md."
              )
          print(f"lock covers all {len(needed)} resolved packages")
          EOF

      - name: The app builds with real settings
        env:
          DATABASE_URL: postgresql+asyncpg://u:p@localhost:5432/db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci
          ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
        run: python -c "from app.main import create_app; create_app()"
