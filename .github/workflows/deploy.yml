name: Deploy landing to EC2

# The cutover is done: dosebuddyapp.com is served from this box, verified at 30
# of 30 by deploy/verify.sh, so a push to main is now the way the site ships.
#
# Paths are filtered because GitHub Pages still publishes from this branch as
# the rollback, and a README edit has no business restarting anything.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '404.html'
      - 'es/**'
      - 'css/**'
      - 'js/**'
      - 'img/**'
      - 'fonts/**'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'api/**'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      # Pinned rather than StrictHostKeyChecking=no. This box will hold article 9
      # health data once the api lands on it, and a deploy that trusts whatever
      # answers on port 22 is a standing hole. Produce the secret with:
      #   ssh-keyscan -t ed25519 <elastic-ip>
      - name: Pin the host key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.EC2_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh "ubuntu@${EC2_HOST}" 'bash -euo pipefail -s' <<'REMOTE'
            cd /home/ubuntu/dosebuddy-site

            git fetch --prune origin
            git reset --hard origin/main

            # Publish only the site itself; see deploy/site-exclude.txt.
            rsync -a --delete \
              --exclude-from=deploy/site-exclude.txt \
              ./ /srv/dosebuddy/site/

            cd deploy
            docker compose up -d --build

            # Schema first, then the code that expects it.
            docker compose run --rm -T api alembic upgrade head

            for _ in $(seq 30); do
              docker compose exec -T nginx nginx -t >/dev/null 2>&1 && break
              sleep 1
            done

            # nginx reads its config from a bind mount, so `up -d` alone does not
            # pick up a config change. Test first: a failed test aborts the deploy
            # and leaves the previous config serving, which is the safe outcome.
            docker compose exec -T nginx nginx -t
            docker compose exec -T nginx nginx -s reload

            # Fail the deploy if the api never becomes ready. Without this the
            # job goes green while the API answers 502, which is the shape of
            # outage that gets noticed by users rather than by us.
            for _ in $(seq 30); do
              state=$(docker inspect -f '{{.State.Health.Status}}' dosebuddy-api 2>/dev/null || echo missing)
              [ "$state" = "healthy" ] && break
              sleep 4
            done
            [ "$(docker inspect -f '{{.State.Health.Status}}' dosebuddy-api)" = "healthy" ] \
              || { echo "api never became ready"; docker compose logs --tail=50 api; exit 1; }
          REMOTE

      # Smoke test from outside, over the real DNS and the real certificate.
      # api.dosebuddyapp.com joins this once its certificate exists.
      - name: Smoke test
        run: curl -fsS -o /dev/null https://dosebuddyapp.com/
