name: Deploy landing to EC2

# The cutover is done: dosebuddyapp.com is served from this box, verified at 30
# of 30 by deploy/verify.sh, so a push to main is now the way the site ships.
#
# Paths are filtered because GitHub Pages still publishes from this branch as
# the rollback, and a README edit has no business restarting anything.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '404.html'
      - 'es/**'
      - 'css/**'
      - 'js/**'
      - 'img/**'
      - 'fonts/**'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'api/**'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      # Pinned rather than StrictHostKeyChecking=no. This box will hold article 9
      # health data once the api lands on it, and a deploy that trusts whatever
      # answers on port 22 is a standing hole. Produce the secret with:
      #   ssh-keyscan -t ed25519 <elastic-ip>
      - name: Pin the host key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.EC2_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Check out the deploy script
        uses: actions/checkout@v4
        with:
          sparse-checkout: deploy/remote-deploy.sh
          sparse-checkout-cone-mode: false

      # The script is copied over and executed, never piped into `bash -s`.
      # Piping it in means stdin is the script, and the first
      # `docker compose exec -T` forwards stdin to the container and eats the
      # rest of it — silently, with a zero exit. Copying it also means a change
      # to the script takes effect on this run rather than the next one.
      - name: Deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          scp deploy/remote-deploy.sh "ubuntu@${EC2_HOST}:/tmp/remote-deploy.sh"
          ssh "ubuntu@${EC2_HOST}" 'bash /tmp/remote-deploy.sh'

      # Smoke test from outside, over the real DNS and the real certificates.
      # Both matter: the landing is what users see, the api is what the app
      # depends on, and a deploy that leaves either broken is not a success.
      - name: Smoke test
        run: |
          curl -fsS -o /dev/null https://dosebuddyapp.com/
          curl -fsS -o /dev/null https://api.dosebuddyapp.com/health
