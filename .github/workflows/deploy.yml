name: Deploy landing to EC2

# Manual only, on purpose. dosebuddyapp.com is still served by GitHub Pages, and
# Pages publishes from this same branch — so until the DNS cutover is done and
# verified, a push to main deploys to Pages and this workflow is the only way to
# put anything on the EC2 box.
#
# The `push` trigger below is uncommented as the last step of the cutover, once
# deploy/verify.sh is green against the live names (deploy/README.md).
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      # Pinned rather than StrictHostKeyChecking=no. This box will hold article 9
      # health data once the api lands on it, and a deploy that trusts whatever
      # answers on port 22 is a standing hole. Produce the secret with:
      #   ssh-keyscan -t ed25519 <elastic-ip>
      - name: Pin the host key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.EC2_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh "ubuntu@${EC2_HOST}" 'bash -euo pipefail -s' <<'REMOTE'
            cd /home/ubuntu/dosebuddy-site

            git fetch --prune origin
            git reset --hard origin/main

            # Publish only the site itself; see deploy/site-exclude.txt.
            rsync -a --delete \
              --exclude-from=deploy/site-exclude.txt \
              ./ /srv/dosebuddy/site/

            cd deploy
            docker compose up -d

            for _ in $(seq 30); do
              docker compose exec -T nginx nginx -t >/dev/null 2>&1 && break
              sleep 1
            done

            # nginx reads its config from a bind mount, so `up -d` alone does not
            # pick up a config change. Test first: a failed test aborts the deploy
            # and leaves the previous config serving, which is the safe outcome.
            docker compose exec -T nginx nginx -t
            docker compose exec -T nginx nginx -s reload
          REMOTE

      - name: Verify the deployed site
        run: |
          curl -fsS -o /dev/null https://dosebuddyapp.com/ \
            || echo "::warning::apex not reachable yet — expected before the DNS cutover"
