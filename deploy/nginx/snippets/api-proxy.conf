# Everything the API vhost does apart from naming itself and its certificate.
#
# It was written when two hostnames served this and copying the block into both
# would have let them drift. One hostname serves it now, and the file stays
# split anyway for the other half of the reason: the API is configured here and
# the landing is configured in snippets/landing.conf, so no change to one is
# ever a change to the other. deploy/verify.sh keeps meaning what it says.
    # Same value as the landing; the reasoning is in snippets/landing.conf.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Nothing here is a web page. Keeping it out of the index costs nothing and
    # stops the API surface turning up in search results.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Photos of packaging go to S3 directly, not through here (spec 5.2), so
    # sync payloads are structured data and small. A generous limit would only
    # widen what a bad request can cost.
    client_max_body_size 2m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # A refusal that says when to come back.
    #
    # nginx's own 429 carries no Retry-After and no body, which leaves a client
    # guessing at both the delay and the cause. The app guessed a full minute —
    # twelve times longer than this bucket needs — and read the bare status as
    # "that request was too large", so it halved its batch size and thereby
    # doubled the number of requests it made. It was throttled for making too
    # many requests and responded by making more.
    #
    # The body is the API's own error envelope (api/app/api/errors.py), so a
    # client branching on `error.code` does not need a special case for the
    # rejections that never reach the application.
    error_page 429 = @rate_limited;

    location @rate_limited {
        # add_header replaces, rather than adds to, what an outer level set — so
        # the two headers that must survive a 429 are repeated here.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Retry-After 5 always;

        default_type application/json;
        return 429 '{"error":{"code":"rate_limited","message":"Too many requests; retry after 5 seconds."}}';
    }

    location / {
        limit_req  zone=site_limit burst=20 nodelay;
        limit_conn site_conn 20;
        include /etc/nginx/snippets/api-upstream.conf;
    }

    # The push/pull pair, on the budget sized for it in conf.d/00-common.conf.
    # Trailing slash on purpose: `/v1/sync` as a prefix would also claim any
    # future path that merely starts with those characters.
    location /v1/sync/ {
        limit_req  zone=sync_limit burst=60 nodelay;
        limit_conn site_conn 20;
        include /etc/nginx/snippets/api-upstream.conf;
    }
