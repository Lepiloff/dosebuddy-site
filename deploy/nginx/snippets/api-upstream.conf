# How a request reaches the API container. Included by every location in the
# API vhost that proxies, so the two of them cannot drift into behaving
# differently — which is the same reason api-proxy.conf exists one level up.

    # Resolve the upstream per request instead of at config load.
    #
    # This is the whole reason the API cannot take the landing down with it.
    # `proxy_pass http://api:8000;` with a literal name is resolved when nginx
    # loads its config, so a stopped api container makes nginx fail to start —
    # and nginx not starting means the landing is gone too. Through a variable,
    # nginx starts regardless and this vhost simply answers 502 while the site
    # keeps serving.
    #
    # `resolver` lives at server level in api-proxy.conf; only the lookup is
    # here.
    set $api_upstream api:8000;
    proxy_pass http://$api_upstream;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;
