# How the landing is served. Included by the production vhost and, unchanged, by
# the rehearsal vhost — the rehearsal is only worth running if it exercises the
# same rules the live host will.
#
# Every rule here matches an observed GitHub Pages behaviour. Baseline captured
# 2026-08-09; deploy/verify.sh is the executable form of it.

root /srv/dosebuddy/site;
index index.html;
charset utf-8;

# Pages answered a missing path with 404 and the body of 404.html.
error_page 404 /404.html;

# A directory with no index (/img/, /css/) answered 404 on Pages. nginx would
# answer 403 by default, so the status is rewritten. Without the `=404` the
# original 403 would leak through and the two hosts would disagree.
error_page 403 =404 /404.html;

# Note: /404.html itself is a normal 200 on Pages, so it must NOT be marked
# `internal` — that would turn a direct request into a 404.

# Response headers. All of them live at this level on purpose: an add_header
# inside a location block discards every header inherited from the parent, so
# adding one deeper down would silently strip the security headers from that
# path. If a location ever needs its own header, it has to repeat the whole set.
add_header Cache-Control $dosebuddy_cache_control always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "accelerometer=(), camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# Deliberately short to start with. GitHub Pages sent no HSTS at all, so this is
# a new promise to browsers; a year-long one on day one would make the rollback
# to Pages painful if GitHub's certificate for the domain had lapsed by then.
# Raised to 31536000 once the move has held for a week (deploy/README.md).
add_header Strict-Transport-Security "max-age=300" always;

gzip on;
gzip_vary on;
gzip_types text/plain text/css text/xml application/xml application/javascript
           application/json image/svg+xml;

location / {
    limit_req  zone=site_limit burst=20 nodelay;
    limit_conn site_conn 20;

    # No try_files here, and that is the whole point. `try_files $uri $uri/`
    # would serve /es with a 200 by internally rewriting it to /es/, leaving two
    # URLs answering with the same page. Pages issued a 301 from /es to /es/,
    # and so does nginx's static module when it is left to resolve the directory
    # itself. Checked explicitly in deploy/verify.sh.
}

# Certbot's HTTP-01 webroot. `^~` so it beats the dotfile rule below, which
# would otherwise swallow every path starting with a dot.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    access_log off;
}

# Hidden files: .git, .env and friends. Answers 404 rather than 403 so it does
# not confirm that something is there.
location ~ /\. {
    return 404;
}

# The site has no PHP and no WordPress. Scanners looking for either get the
# connection closed with no response, which is the cheapest possible answer.
location ~* \.php$ {
    return 444;
    access_log off;
}

location ~* /(wp-admin|wp-content|wp-includes|wp-login|xmlrpc) {
    return 444;
    access_log off;
}
