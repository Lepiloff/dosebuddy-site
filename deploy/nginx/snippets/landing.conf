# How the landing is served. Included by the production vhost and, unchanged, by
# the rehearsal vhost — the rehearsal is only worth running if it exercises the
# same rules the live host will.
#
# Every rule here matches an observed GitHub Pages behaviour. Baseline captured
# 2026-08-09; deploy/verify.sh is the executable form of it.

root /srv/dosebuddy/site;
index index.html;
charset utf-8;

# Pages answered a missing path with 404 and the body of 404.html.
error_page 404 /404.html;

# A directory with no index (/img/, /css/) answered 404 on Pages. nginx would
# answer 403 by default, so the status is rewritten. Without the `=404` the
# original 403 would leak through and the two hosts would disagree.
error_page 403 =404 /404.html;

# Note: /404.html itself is a normal 200 on Pages, so it must NOT be marked
# `internal` — that would turn a direct request into a 404.

# Response headers. All of them live at this level on purpose: an add_header
# inside a location block discards every header inherited from the parent, so
# adding one deeper down would silently strip the security headers from that
# path. If a location ever needs its own header, it has to repeat the whole set.
add_header Cache-Control $dosebuddy_cache_control always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "accelerometer=(), camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# Deferred out of the migration on purpose, and added once it had held: a CSP
# mistake must not look like a hosting failure. The hash covers the one inline
# script each page carries (the anti-CLS language hint) — identical in both
# locales, so one hash serves both. If that script is ever edited, this hash
# must be regenerated or the page silently loses it.
#
# The allowances are exactly what the page uses and nothing else:
# googletagmanager for gtag.js, google-analytics for the beacons it sends, and
# youtube-nocookie for the video player that is only built after a click.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-WIbaUDTu01JLk1QIuSh4J34t9IVyP6SkS3PraZmVUuM=' https://www.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; style-src 'self'; font-src 'self'; frame-src https://www.youtube-nocookie.com; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'" always;

# A year, since 2026-08-18. It began at max-age=300 on purpose: Pages sent no
# HSTS at all, so this was a new promise to browsers, and a year-long one made
# on the day of the move would have left a painful rollback if GitHub's
# certificate for the domain had lapsed by then. The move has held since
# 2026-08-09 and Pages is no longer the fallback, so five minutes bought
# nothing further while looking like protection it did not give.
#
# Neither includeSubDomains nor preload is set. Both are much harder to undo
# than this line — preload in particular is removed by asking a browser vendor,
# not by editing a config — and neither has been decided.
add_header Strict-Transport-Security "max-age=31536000" always;

gzip on;
gzip_vary on;
gzip_types text/plain text/css text/xml application/xml application/javascript
           application/json image/svg+xml;

location / {
    limit_req  zone=site_limit burst=20 nodelay;
    limit_conn site_conn 20;

    # No try_files here, and that is the whole point. `try_files $uri $uri/`
    # would serve /es with a 200 by internally rewriting it to /es/, leaving two
    # URLs answering with the same page. Pages issued a 301 from /es to /es/,
    # and so does nginx's static module when it is left to resolve the directory
    # itself. Checked explicitly in deploy/verify.sh.
}

# Certbot's HTTP-01 webroot. `^~` so it beats the dotfile rule below, which
# would otherwise swallow every path starting with a dot.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    access_log off;
}

# Hidden files: .git, .env and friends. Answers 404 rather than 403 so it does
# not confirm that something is there.
location ~ /\. {
    return 404;
}

# The site has no PHP and no WordPress. Scanners looking for either get the
# connection closed with no response, which is the cheapest possible answer.
location ~* \.php$ {
    return 444;
    access_log off;
}

location ~* /(wp-admin|wp-content|wp-includes|wp-login|xmlrpc) {
    return 444;
    access_log off;
}
