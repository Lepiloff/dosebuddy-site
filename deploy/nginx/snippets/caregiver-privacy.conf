# This endpoint carries account-bound opaque cursors in its query. nginx error
# messages (limit_req/upstream failures included) embed the raw request URI;
# access_log off alone does not protect it. Disable both sinks for this route.
access_log off;
error_log /dev/null crit;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Cache-Control "private, no-store" always;
add_header Pragma "no-cache" always;
add_header Vary "Authorization" always;
