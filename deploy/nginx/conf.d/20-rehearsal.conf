# TEMPORARY — delete once the cutover is done and verified.
#
# new.dosebuddyapp.com exists for one reason: to prove the stack over real TLS
# while dosebuddyapp.com is still served by GitHub Pages. Certbot issues for it
# over ordinary automatic HTTP-01, so the rehearsal costs no manual DNS work and
# the live site is untouched while it runs.
#
# It includes the same landing.conf as production, unchanged. A rehearsal on a
# different config would prove nothing.
#
# Removal is step 5 of the cutover (deploy/README.md): delete this file, delete
# the A record, delete the certificate.

server {
    listen 80;
    server_name new.dosebuddyapp.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    location / {
        return 301 https://new.dosebuddyapp.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name new.dosebuddyapp.com;

    ssl_certificate     /etc/letsencrypt/live/new.dosebuddyapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new.dosebuddyapp.com/privkey.pem;

    include /etc/nginx/snippets/landing.conf;

    # Non-negotiable while this host is reachable. Without it Google can find the
    # subdomain and index a second copy of the landing, which is precisely the
    # duplicate content this migration exists to avoid. Sits at server level so
    # it stacks with the headers landing.conf sets rather than replacing them.
    add_header X-Robots-Tag "noindex, nofollow" always;
}
