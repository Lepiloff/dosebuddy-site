# sonadose.com — phase one of the move, and deliberately almost empty.
#
# A vhost that names a certificate nginx cannot find makes `nginx -t` fail, and
# the deploy script runs `nginx -t` before it reloads. The site would stay up —
# the running config is untouched — but the deploy would go red and the new host
# would still not exist. So the certificate has to come first, and the HTTP-01
# challenge that issues it needs port 80 already answering for these names.
#
# Hence this file: port 80 only, no TLS, nothing to break. It exists so
# `init-cert.sh sonadose.com www.sonadose.com` and `init-cert.sh
# api.sonadose.com` have somewhere to land. Once the certificates are on the
# box, 10-sonadose.conf replaces it and this file is deleted — rsync runs with
# --delete, so removing it here removes it there.
#
# Everything that is not a challenge gets a 404 on purpose. The names are not
# ready to serve, and pointing them at the old domain for the ten minutes this
# lasts would put a redirect in browser caches that we would then have to
# undo.

server {
    listen 80;
    server_name sonadose.com www.sonadose.com api.sonadose.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    location / {
        return 404;
    }
}
