# Shared http-level settings for every vhost on this box.
#
# Kept separate from the site config because the FastAPI api and the admin
# surface land on this same nginx later (spec part 4.1) and will want the same
# limits and the same cache policy.

server_tokens off;

# Cache-Control parity with GitHub Pages, which sent max-age=600 on everything.
# Images and fonts are the exception: they are content-stable and were the only
# thing worth caching longer. CSS and JS deliberately stay at 600 — they are
# hand-edited alongside the HTML and are not content-hashed, so a long-lived
# stale script against fresh markup is a real breakage, not a theoretical one.
map $sent_http_content_type $dosebuddy_cache_control {
    default    "max-age=600";
    ~^image/   "max-age=2592000";
    ~^font/    "max-age=2592000";
}

# TLS parameters shared by every vhost (Mozilla "intermediate"). Written out
# rather than pulled from certbot's options-ssl-nginx.conf: `certonly --webroot`
# does not generate that file, so including it would leave nginx unable to start
# on a fresh box. Certificate paths stay per-server.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_session_timeout 1d;
ssl_session_cache shared:SSL:10m;
ssl_session_tickets off;

limit_req_zone  $binary_remote_addr zone=site_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=site_conn:10m;
limit_req_log_level warn;
limit_req_status 429;

# Anything reaching this box under a hostname we do not serve — a scanner on the
# raw Elastic IP, a stale DNS record someone else parked — gets nothing. Without
# this, nginx would answer such requests from the first server block and the
# landing would become reachable under a second hostname, which is exactly the
# duplicate content the migration is supposed to avoid.
server {
    listen 80 default_server;
    return 444;
}

server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}
