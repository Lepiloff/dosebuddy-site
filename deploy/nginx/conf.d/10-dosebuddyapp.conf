# dosebuddyapp.com — kept alive purely to hand people to sonadose.com.
#
# The A records stay pointed at this box on purpose. A redirect is something a
# server performs, so the old name has to keep resolving here for nginx to
# answer it at all; deleting the DNS record does not "free" the old domain, it
# only turns every old link into a connection error.
#
# The certificate is still this domain's own. A browser validates TLS before it
# ever sees a 301, so redirecting an https URL requires a valid certificate for
# the name being left behind — and HSTS with a year on it means browsers that
# came here once will insist on https from now on.
#
# api.dosebuddyapp.com is NOT redirected. It is in 20-api.conf and still serves
# the API, because the address is compiled into builds already on phones and a
# 301 is not something an API client can be assumed to follow correctly —
# especially not with a request body. That host retires on its own signal.

server {
    listen 80;
    server_name dosebuddyapp.com www.dosebuddyapp.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    location / {
        return 301 https://sonadose.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name dosebuddyapp.com www.dosebuddyapp.com;

    ssl_certificate     /etc/letsencrypt/live/dosebuddyapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dosebuddyapp.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    return 301 https://sonadose.com$request_uri;
}
