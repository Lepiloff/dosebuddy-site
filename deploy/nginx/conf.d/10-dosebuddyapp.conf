# dosebuddyapp.com — the landing, moved off GitHub Pages.
#
# Four server blocks reproduce what GitHub gave us for free: http -> https,
# www -> apex, and TLS. The apex over https is the only one that serves bytes.
# Canonical host is the apex, unchanged from Pages (landing plan section 9).

# ---------------------------------------------------------------------------
# www, http. Pages collapsed this to https://apex in a single hop rather than
# bouncing through https://www first, and so does this.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name www.dosebuddyapp.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    location / {
        return 301 https://dosebuddyapp.com$request_uri;
    }
}

# ---------------------------------------------------------------------------
# apex, http.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name dosebuddyapp.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    location / {
        return 301 https://dosebuddyapp.com$request_uri;
    }
}

# ---------------------------------------------------------------------------
# www, https -> apex.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name www.dosebuddyapp.com;

    ssl_certificate     /etc/letsencrypt/live/dosebuddyapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dosebuddyapp.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=300" always;

    return 301 https://dosebuddyapp.com$request_uri;
}

# ---------------------------------------------------------------------------
# apex, https. The site.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name dosebuddyapp.com;

    ssl_certificate     /etc/letsencrypt/live/dosebuddyapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dosebuddyapp.com/privkey.pem;

    include /etc/nginx/snippets/landing.conf;
}
