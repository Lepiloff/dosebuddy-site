# sonadose.com — the landing.
#
# Same four blocks the old domain had, for the same reasons: http -> https,
# www -> apex in one hop rather than two, and the apex over https is the only
# one that serves bytes. See 10-dosebuddyapp.conf, which now does nothing but
# hand its visitors over here.

server {
    listen 80;
    server_name www.sonadose.com sonadose.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    location / {
        return 301 https://sonadose.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.sonadose.com;

    ssl_certificate     /etc/letsencrypt/live/sonadose.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sonadose.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    return 301 https://sonadose.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name sonadose.com;

    ssl_certificate     /etc/letsencrypt/live/sonadose.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sonadose.com/privkey.pem;

    include /etc/nginx/snippets/landing.conf;
}
