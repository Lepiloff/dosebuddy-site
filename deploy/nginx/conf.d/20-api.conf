# api.sonadose.com — the v1.1 backend.
#
# api.dosebuddyapp.com is gone. It served unredirected during the move, on the
# reasoning that an API client cannot be assumed to follow a 301 and a
# redirected POST can arrive without its body. That reasoning still holds; what
# changed is that nothing calls it — the app track moved apiBaseUrl before the
# rename shipped, and the build in the store has no API at all.
#
# Its own hostname rather than a path under the landing, so the landing config
# is never touched to change the API: deploy/verify.sh keeps meaning what it
# says, and a mistake here cannot take the site down.

server {
    listen 80;
    server_name api.sonadose.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.sonadose.com;

    ssl_certificate     /etc/letsencrypt/live/api.sonadose.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sonadose.com/privkey.pem;

    include /etc/nginx/snippets/api-proxy.conf;
}
