# The v1.1 backend, on two hostnames during the move.
#
# api.sonadose.com is the address new builds use. api.dosebuddyapp.com keeps
# serving, unredirected, because it is compiled into builds already installed
# and an API client cannot be assumed to follow a 301 — a redirected POST can
# arrive without its body, which for a sync endpoint is data loss rather than an
# inconvenience. It retires when the app track says no build in the wild still
# names it, and not before.
#
# Its own hostname rather than a path under the landing, so the landing config
# is never touched to change the API: deploy/verify.sh keeps meaning what it
# says, and a mistake here cannot take the site down.

server {
    listen 80;
    server_name api.sonadose.com api.dosebuddyapp.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.sonadose.com;

    ssl_certificate     /etc/letsencrypt/live/api.sonadose.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sonadose.com/privkey.pem;

    include /etc/nginx/snippets/api-proxy.conf;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.dosebuddyapp.com;

    ssl_certificate     /etc/letsencrypt/live/api.dosebuddyapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.dosebuddyapp.com/privkey.pem;

    include /etc/nginx/snippets/api-proxy.conf;
}
