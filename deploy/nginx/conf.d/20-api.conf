# api.dosebuddyapp.com — the v1.1 backend.
#
# Its own hostname rather than a path under the landing, because the address
# ends up compiled into app builds that are already on people's phones. A
# separate vhost also means the landing's config is never touched to change the
# API, so deploy/verify.sh keeps meaning what it says and a mistake here cannot
# take the site down.

server {
    listen 80;
    server_name api.dosebuddyapp.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    location / {
        return 301 https://api.dosebuddyapp.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.dosebuddyapp.com;

    ssl_certificate     /etc/letsencrypt/live/api.dosebuddyapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.dosebuddyapp.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Nothing here is a web page. Keeping it out of the index costs nothing and
    # stops the API surface turning up in search results.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Photos of packaging go to S3 directly, not through here (spec 5.2), so
    # sync payloads are structured data and small. A generous limit would only
    # widen what a bad request can cost.
    client_max_body_size 2m;

    # Resolve the upstream per request instead of at config load.
    #
    # This is the whole reason the API cannot take the landing down with it.
    # `proxy_pass http://api:8000;` with a literal name is resolved when nginx
    # loads its config, so a stopped api container makes nginx fail to start —
    # and nginx not starting means dosebuddyapp.com is gone too. Through a
    # variable, nginx starts regardless and this vhost simply answers 502 while
    # the site keeps serving.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        limit_req  zone=site_limit burst=20 nodelay;
        limit_conn site_conn 20;

        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}
