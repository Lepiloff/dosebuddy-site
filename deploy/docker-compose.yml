# The whole box: the landing, and the API behind it.
#
# Modelled on the stack already running canna (canna/docker-compose.yaml), so
# there is nothing new to learn here.
#
# Postgres and Redis publish no ports. They are reachable only from this
# network, which is the single most useful thing that can be said about a
# database holding article 9 health data. nginx is the only way in.
#
# Secrets come from deploy/.env, which is gitignored; deploy/env.example
# documents it. See deploy/README.md for creating it.

name: dosebuddy

networks:
  dosebuddy:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: dosebuddy-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - /srv/dosebuddy/site:/srv/dosebuddy/site:ro
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    # Reload every six hours so a certificate renewed by the sidecar is picked
    # up without anyone having to remember to do it.
    #
    # Exec form, single line, deliberately. Written as a YAML folded scalar this
    # silently broke: a continuation line indented deeper than the first keeps
    # its newline instead of folding, so the shell never reached nginx and the
    # container sat there running nothing but the sleep loop, accepting
    # connections through docker-proxy and dropping them.
    #
    # `exec` matters too: it makes nginx the container's main process, so if
    # nginx dies the container dies and the restart policy applies. Without it
    # the shell outlives nginx and the container stays "up" while serving
    # nothing, which is the failure that is hardest to notice.
    command: ["/bin/sh", "-c", "while :; do sleep 6h; nginx -s reload; done & exec nginx -g 'daemon off;'"]
    networks:
      - dosebuddy

  certbot:
    image: certbot/certbot
    container_name: dosebuddy-certbot
    restart: unless-stopped
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    # Exec form for the same reason as nginx above. `$$!` becomes `$!` after
    # compose's escaping; waiting on the sleep rather than sleeping outright is
    # what lets a stop signal land promptly instead of waiting out the timeout.
    entrypoint: ["/bin/sh", "-c", "trap 'exit 0' TERM; while :; do certbot renew; sleep 12h & wait $$!; done"]
    networks:
      - dosebuddy

  # The alert loop, in its own process rather than a task inside the API.
  # Every uvicorn worker would run its own copy of a background task and tell
  # the same caregiver the same thing once per worker — invisible with one
  # worker, a surprise the day there are two.
  worker:
    build:
      context: ../api
    image: dosebuddy-api:local
    container_name: dosebuddy-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_CREDENTIALS_PATH: ${FCM_CREDENTIALS_PATH:-}
    volumes:
      # Read-only, and only the worker gets it: the API never sends a push, so
      # there is no reason for the credential to be reachable from the process
      # that handles requests from the internet.
      - ./secrets:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dosebuddy

  postgres:
    image: postgres:16-alpine
    container_name: dosebuddy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dosebuddy

  redis:
    image: redis:7-alpine
    container_name: dosebuddy-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - dosebuddy

  api:
    build:
      context: ../api
    image: dosebuddy-api:local
    container_name: dosebuddy-api
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      # Composed here rather than written out in .env so the password exists in
      # exactly one place and the two cannot drift apart.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET}
      # Losing this key means the encrypted columns are unreadable. It is not
      # recoverable and not derivable — back it up wherever the box's own
      # secrets are kept.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Readiness, not liveness: this is what the deploy waits on, and it is
      # only true once Postgres and Redis actually answer.
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4).status==200 else 1)"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s
    networks:
      - dosebuddy
